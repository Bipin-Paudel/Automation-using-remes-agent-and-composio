readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "composio-core>=0.7.21",
    "composio-openai>=0.11.4",
    "composio-openai-agents>=0.11.4",
    "openai-agents>=0.13.2",
    "python-dotenv>=1.2.2",
    "discord.py>=2.4.0",
    "aiohttp>=3.9.0",
    "slack-bolt>=1.27.0",
    "openpyxl>=3.1.5",
]
